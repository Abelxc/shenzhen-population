<style>

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--grid);border-radius:999px;padding:4px 11px;cursor:pointer;user-select:none;background:#fff;transition:.15s;}

  .chip.off{opacity:.38;background:#fafafa;}
  .citybtn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;border:1px solid var(--grid);border-radius:999px;padding:5px 13px;cursor:pointer;background:#fff;color:var(--ink);}
  .citybtn .bar{width:18px;height:3px;background:var(--city);border-radius:2px;}
  .citybtn.off{opacity:.45;}
  .card{background:#fff;border:1px solid var(--grid);border-radius:12px;padding:12px 12px 6px;margin-bottom:14px;}
  .card h2{font-size:14.5px;margin:2px 4px 6px;font-weight:600;}
  svg{width:100%;height:auto;display:block;}
  .tip{position:absolute;pointer-events:none;background:rgba(31,41,51,.96);color:#fff;font-size:12px;padding:8px 11px;border-radius:8px;line-height:1.55;opacity:0;transition:.08s;z-index:5;min-width:150px;}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin:8px 4px 0;font-size:12.5px;color:var(--muted);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:13px;height:13px;display:inline-block;border-radius:3px;background:currentColor;}
  .note{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.65;}
  .preset{background:#eef4fb;border-left:3px solid var(--accent);color:#33414f;font-size:12.5px;padding:8px 12px;border-radius:0 8px 8px 0;margin:0 0 14px;line-height:1.7;}
  .preset b{color:#1f2933;}
  .axis text{fill:var(--muted);font-size:11px;}
  .gridline{stroke:var(--grid);stroke-dasharray:2 3;}
  .aline{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;}
  .hoverline{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;}
</style>
</head>

const CITY = "__CITY__";
// 9 个行政区配色（清晰区分）
const COLORS = ["#C0392B","#E8A33D","#2E8B57","#2980B9","#8E44AD","#16A085","#D35400","#2C3E50","#7FB800"];
const years = DATA.years;
const districts = DATA.districts;
const state = { visible:new Set(), showCity:true, yearsFocus:[2011,2017], marks:[{year:2017,label:"2017 破1500万",color:"#1f2933"}] };
function xBounds(){ return state.yearsFocus||[years[0],years[years.length-1]]; }
const W=960, H=360, M={t:20,r:22,b:40,l:60};

function colorOf(d){ return COLORS[districts.indexOf(d)]; }
// 人口总量按 万人 绘制；密度按 人/km²
function buildSeries(d, metric){
  const b=state.yearsFocus;
  const pts=[];
  if(d===CITY){
    const src = metric==="pop" ? DATA.cityPop : DATA.cityDens;
    for(const y of years){
      if(b && (y<b[0]||y>b[1])) continue;
      const v = src[String(y)];
      if(v==null) continue;
      pts.push({year:+y, v: metric==="pop" ? v/10000 : v});
    }
  } else {
    const rec = DATA.recs[d];
    for(const y of years){
      if(b && (y<b[0]||y>b[1])) continue;
      const r = rec[String(y)];
      if(!r) continue;
      pts.push({year:+y, v: metric==="pop" ? r[0]/10000 : r[1]});
    }
  }
  return pts;
}

function niceMax(v){
  if(v<=0) return 1;
  const pow=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/pow; let m;
  if(n<=1)m=1; else if(n<=2)m=2; else if(n<=2.5)m=2.5; else if(n<=5)m=5; else m=10;
  return m*pow;
}

function fmt(v, metric){ return metric==="pop" ? v.toFixed(0) : v.toFixed(0); }

function drawChart(svgId, tipId, metric){
  const svg=document.getElementById(svgId);
  const tip=document.getElementById(tipId);
  svg.innerHTML="";
  const lines=[];
  if(state.showCity) lines.push({key:CITY, color:"#1f2933", series:buildSeries(CITY,metric), bold:true});
  districts.forEach(d=>{ if(state.visible.has(d)) lines.push({key:d, color:colorOf(d), series:buildSeries(d,metric), bold:false}); });
  let maxV=0;
  lines.forEach(l=>l.series.forEach(p=>{ if(p.v>maxV)maxV=p.v; }));
  maxV=niceMax(maxV||1);
  const x0=M.l,x1=W-M.r,y0=H-M.b,y1=M.t;
  const xb=xBounds();
  const xOf=y=>x0+(y-xb[0])/(xb[1]-xb[0])*(x1-x0);
  const yOf=v=>y0-v/maxV*(y0-y1);
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const v=maxV*i/ticks, yy=yOf(v);
    svg.insertAdjacentHTML("beforeend",`<line class="gridline" x1="${x0}" y1="${yy}" x2="${x1}" y2="${yy}"/>`);
    svg.insertAdjacentHTML("beforeend",`<text class="axis" x="${x0-8}" y="${yy+4}" text-anchor="end">${fmt(v,metric)}</text>`);
  }
  const step=years.length>15?3:2;
  years.forEach(y=>{
    if(y<xb[0]||y>xb[1]) return;
    if(y===xb[0]||y===xb[1]||y%step===0)
      svg.insertAdjacentHTML("beforeend",`<text class="axis" x="${xOf(y)}" y="${y0+18}" text-anchor="middle">${y}</text>`);
  });
  svg.insertAdjacentHTML("beforeend",`<line class="axis" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}"/>`);
  svg.insertAdjacentHTML("beforeend",`<line class="axis" x1="${x0}" y1="${y1}" x2="${x0}" y2="${y0}"/>`);
  const ylab = metric==="pop" ? "人口总量（万人）" : "人口密度（人/km²）";
  svg.insertAdjacentHTML("beforeend",`<text class="axis" x="15" y="${(y0+y1)/2}" text-anchor="middle" transform="rotate(-90 15 ${(y0+y1)/2})">${ylab}</text>`);
  lines.forEach(l=>{
    const pts=l.series;
    if(pts.length<2) return;
    const d=pts.map((p,i)=>(i?"L":"M")+xOf(p.year)+" "+yOf(p.v)).join(" ");
    const w=l.bold?3.4:2.2;
    svg.insertAdjacentHTML("beforeend",`<path class="aline" d="${d}" stroke="${l.color}" stroke-width="${w}"/>`);
    pts.forEach(p=>svg.insertAdjacentHTML("beforeend",`<circle cx="${xOf(p.year)}" cy="${yOf(p.v)}" r="${l.bold?3:2.4}" fill="${l.color}" stroke="#fff" stroke-width="1"/>`));
  });
  (state.marks||[]).forEach(mk=>{
    const mx=xOf(mk.year);
    svg.insertAdjacentHTML("beforeend",`<line x1="${mx}" y1="${y1}" x2="${mx}" y2="${y0}" stroke="${mk.color||'#8a8a8a'}" stroke-width="1.4" stroke-dasharray="4 3"/>`);
    svg.insertAdjacentHTML("beforeend",`<text x="${mx+5}" y="${y1+13}" fill="${mk.color||'#8a8a8a'}" font-size="11">${mk.label||mk.year}</text>`);
  });
  const ov=document.createElementNS("http://www.w3.org/2000/svg","rect");
  ov.setAttribute("x",x0); ov.setAttribute("y",y1); ov.setAttribute("width",x1-x0); ov.setAttribute("height",y0-y1);
  ov.setAttribute("fill","transparent"); ov.style.cursor="crosshair";
  svg.appendChild(ov);
  ov.addEventListener("mousemove",e=>onHover(e,svg,tip,metric,x0,x1,y0,y1,xOf,yOf));
  ov.addEventListener("mouseleave",()=>{ tip.style.opacity=0; const hl=svg.querySelector("#hl"); if(hl)hl.remove(); });
}

function onHover(ev,svg,tip,metric,x0,x1,y0,y1,xOf,yOf){
  const rect=svg.getBoundingClientRect();
  const sx=(ev.clientX-rect.left)/rect.width*W;
  const b=xBounds();
  let yr=Math.round(b[0]+(sx-x0)/(x1-x0)*(b[1]-b[0]));
  yr=Math.max(b[0],Math.min(b[1],yr));
  if(yr<b[0]||yr>b[1]) return;
  const hl=svg.querySelector("#hl"); if(hl)hl.remove();
  svg.insertAdjacentHTML("beforeend",`<line class="hoverline" id="hl" x1="${xOf(yr)}" y1="${y1}" x2="${xOf(yr)}" y2="${y0}"/>`);
  let rows="";
  const add=(label,color,v)=>{ if(v==null)return; const unit=metric==="pop"?" 万人":" 人/km²"; rows+=`<div><span style="color:${color}">■</span> ${label}: <b>${v.toFixed(metric==="pop"?0:0)}</b>${unit}</div>`; };
  if(state.showCity) add("深圳市（全市合计）","#1f2933", metric==="pop"?DATA.cityPop[String(yr)]/10000:DATA.cityDens[String(yr)]);
  districts.forEach(d=>{ if(state.visible.has(d)){ const r=DATA.recs[d][String(yr)]; if(r) add(d,colorOf(d), metric==="pop"?r[0]/10000:r[1]); } });
  tip.innerHTML=`<b>${yr} 年</b>${rows}`;
  tip.style.opacity=1;
  const card=svg.parentElement.getBoundingClientRect();
  let tx=ev.clientX-card.left+14, ty=ev.clientY-card.top+14;
  if(tx+180>card.width) tx=ev.clientX-card.left-188;
  tip.style.left=tx+"px"; tip.style.top=ty+"px";
}

// ---- UI ----
const chips=document.getElementById("chips");
districts.forEach(d=>{
  const c=document.createElement("div"); c.className="chip";
  c.innerHTML='<span class="dot" style="color:'+colorOf(d)+'"></span>'+d;
  c.onclick=()=>{
    if(state.visible.has(d)){ state.visible.delete(d); c.classList.add("off"); }
    else { state.visible.add(d); c.classList.remove("off"); }
    chips.querySelectorAll(".chip").forEach((c,i)=>{ c.classList.toggle("off", !state.visible.has(districts[i])); });
cityBtn.classList.toggle("off", !state.showCity);
renderAll();
  };
  chips.appendChild(c);
});

const cityBtn=document.getElementById("cityBtn");
cityBtn.onclick=()=>{ state.showCity=!state.showCity; cityBtn.classList.toggle("off",!state.showCity); renderAll(); };

const legend=document.getElementById("legend");
legend.insertAdjacentHTML("beforeend",'<span><i style="color:#1f2933"></i>深圳市（全市合计 / 平均）</span>');
districts.forEach(d=>legend.insertAdjacentHTML("beforeend",'<span><i style="color:'+colorOf(d)+'"></i>'+d+'</span>'));

function renderAll(){ drawChart("chartPop","tipPop","pop"); drawChart("chartDens","tipDens","dens"); }

document.getElementById("note").innerHTML=
 "数据口径：人口总量 pop_total（人）、密度 density（人/km²）取自《深圳城市化_1992_2023_正式行政区口径》geojson 的逐年行政区统计（1997–2023）。"+
 " 早期「宝安县」已并入「宝安区」以保证序列连续。"+
 " 行政区划变迁导致台阶式变化属正常现象：1998 年盐田设区（从罗湖析出）、2017 年龙华/坪山设区（从宝安/龙岗析出）、2018 年光明设区（从宝安析出）。"+
 " 因此宝安、龙岗在 2017–2018 年总量出现下降（人口已划归新区），而「深圳市（全市合计）」线已把新区计入，呈平滑上升。"+
 " 龙岗区含大鹏新区（功能区，不单列统计），其绝对人口约为官方口径 2 倍，内部趋势仍有效。"+
 " 罗湖区 1997 年密度偏低，因其当年辖区面积仍含后来析出的盐田部分。"+
 " 趋势注记：2022 年全市合计出现设市以来首次微降、2023 年随即反弹创阶段新高（与统计公报‘2022 首降、2023 反弹’趋势一致；行政区口径绝对量级与公报有小幅差异）。";

renderAll();
</script>
