.133036473708, "2022": 8800.239655776255, "2023": 8861.159753839996}};

const YEARS_FOCUS = [2021, 2023];

const VISIBLE = [];

const MARKS = [{"year": 2022, "label": "2022 首降", "color": "#C0392B"}];

const DISTRICT_COLORS = {"光明区":"#C0392B","南山区":"#E8A33D","坪山区":"#2E8B57","宝安区":"#2980B9","盐田区":"#8E44AD","福田区":"#16A085","罗湖区":"#D35400","龙华区":"#2C3E50","龙岗区":"#7FB800"};

const CITY_COLOR = "#1f2933";



function filterYears(){

  const all = POP_DATA.years;

  if(!YEARS_FOCUS) return all;

  return all.filter(y => y >= YEARS_FOCUS[0] && y <= YEARS_FOCUS[1]);

}

function buildSeries(metric, years){

  const series = [];

  series.push({

    name:"深圳市（全市合计）",

    type:"bar",

    data: years.map(y => {

      const v = metric === "pop" ? POP_DATA.cityPop[String(y)] : POP_DATA.cityDens[String(y)];

      return v == null ? null : (metric === "pop" ? v / 10000 : v);

    }),

    barWidth:"42%",

    itemStyle:{color:CITY_COLOR, borderRadius:[4,4,0,0]},

    label:{show:true, position:"top", color:CITY_COLOR, fontSize:11, fontWeight:600,

      formatter:function(p){ return p.value == null ? "" : (metric === "pop" ? p.value.toFixed(1) : p.value.toFixed(0)); }},

    z:10

  });

  for(const d of POP_DATA.districts){

    series.push({

      name:d,

      type:"line",

      data: years.map(y => {

        const rec = POP_DATA.recs[d] && POP_DATA.recs[d][String(y)];

        if(!rec) return null;

        return metric === "pop" ? rec[0] / 10000 : rec[1];

      }),

      lineStyle:{width:2,color:DISTRICT_COLORS[d]},

      itemStyle:{color:DISTRICT_COLORS[d]},

      symbol:"circle",

      symbolSize:3,

      smooth:false

    });

  }

  return series;

}

function render(id, metric, yName, years){

  const series = buildSeries(metric, years);

  const selected = {};

  series.forEach(s => { selected[s.name] = (s.name === "深圳市（全市合计）") || VISIBLE.includes(s.name); });

  const option = {

    title:{text:yName, left:"center", top:10, textStyle:{fontSize:16, color:"#1f2933", fontWeight:600}},

    tooltip:{

      trigger:"axis",

      backgroundColor:"rgba(31,41,51,.96)",

      borderColor:"rgba(31,41,51,.96)",

      textStyle:{color:"#fff"},

      formatter:function(params){

        let html = "<b>" + params[0].axisValue + "年</b>";

        params.forEach(p => {

          if(p.value == null) return;

          const unit = metric === "pop" ? " 万人" : " 人/km²";

          html += '<div style="margin-top:4px;"><span style="display:inline-block;margin-right:6px;border-radius:2px;width:10px;height:10px;background:' + p.color + ';"></span>' + p.seriesName + ': <b>' + p.value.toFixed(0) + '</b>' + unit + '</div>';

        });

        return html;

      }

    },

    legend:{type:"scroll", top:42, data:series.map(s=>s.name), selected:selected, textStyle:{color:"#1f2933"}},

    grid:{left:85, right:60, top:90, bottom:50, containLabel:true},

    xAxis:{

      type:"category",

      boundaryGap:true,

      name:"年份",

      nameLocation:"middle",

      nameGap:30,

      nameTextStyle:{color:"#6b7280", fontSize:12},

      data:years.map(String),

      axisLabel:{color:"#6b7280"},

      axisLine:{lineStyle:{color:"#e6eaf0"}},

      splitLine:{show:false}

    },

    yAxis:{

      type:"value",

      name:yName,

      nameLocation:"middle",

      nameGap:55,

      nameTextStyle:{color:"#1f2933", align:"center"},

      axisLabel:{color:"#6b7280"},

      splitLine:{lineStyle:{color:"#e6eaf0", type:"dashed"}}

    },

    series: series.map((s, idx) => {

      const cfg = Object.assign({}, s);

      if(idx === 0 && MARKS.length){

        cfg.markLine = {

          symbol:"none",

          data: MARKS.map(m => ({

            xAxis: String(m.year),

            label:{formatter:m.label, color:m.color, position:"end"},

            lineStyle:{color:m.color, type:"dashed", width:1.5}

          }))

        };

      }

      return cfg;

    })

  };

  const chart = echarts.init(document.getElementById(id));

  chart.setOption(option);

  window.addEventListener("resize", () => chart.resize());

  return chart;

}

const years = filterYears();

render("chart-pop", "pop", "人口总量（万人）", years);

render("chart-dens", "dens", "人口密度（人/km²）", years);



document.getElementById("note").innerHTML = `数据口径：人口总量 pop_total（人）、密度 density（人/km²）取自《深圳城市化_1992_2023_正式行政区口径》geojson 的逐年行政区统计（1997–2023）。早期「宝安县」已并入「宝安区」以保证序列连续。行政区划变迁导致台阶式变化属正常现象：1998 年盐田设区（从罗湖析出）、2017 年龙华/坪山设区（从宝安/龙岗析出）、2018 年光明设区（从宝安析出）。因此宝安、龙岗在 2017–2018 年总量出现下降（人口已划归新区），而「深圳市（全市合计）」线已把新区计入，呈平滑上升。龙岗区含大鹏新区（功能区，不单列统计），其绝对人口约为官方口径 2 倍，内部趋势仍有效。罗湖区 1997 年密度偏低，因其当年辖区面积仍含后来析出的盐田部分。趋势注记：2022 年全市合计出现设市以来首次微降、2023 年随即反弹创阶段新高（与统计公报‘2022 首降、2023 反弹’趋势一致；行政区口径绝对量级与公报有小幅差异）。`;
